name: Release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chimney_ci
          POSTGRES_PASSWORD: chimney_ci
          POSTGRES_DB: chimney_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U chimney_ci -d chimney_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chimney_ci:chimney_ci@127.0.0.1:5432/chimney_ci
      CHIMNEY_TEST_POSTGRES_URL: postgresql+psycopg://chimney_ci:chimney_ci@127.0.0.1:5432/chimney_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Test Flask, the upload worker and database upgrades
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Build the production image
        run: docker build --tag chimney:ci .
      - name: Start the candidate
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          docker run --detach --name chimney-ci --network host -e DATABASE_URL -e SECRET_KEY chimney:ci
          curl --fail --retry 20 --retry-delay 2 --retry-connrefused --output /dev/null http://127.0.0.1:8000/login
      - name: Check the admin and client login journeys
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
      - name: Show startup logs on failure
        if: failure()
        run: docker logs --tail 100 chimney-ci || true
