server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root /home/deploy/chimney-app/frontend/dist;

    client_max_body_size 50M;

    # React's built JS/CSS bundle
    location /assets/ {
        try_files $uri =404;
    }

    # Paths React currently owns — serve the SPA shell.
    # Extend this regex as more pages migrate from Jinja to React.
    location ~ ^/(login|dashboard|admin)$ {
        try_files /index.html /index.html;
    }
    location = / {
        try_files /index.html /index.html;
    }

    # Everything Flask still serves directly
    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/home/deploy/chimney-app/chimney.sock;
    }
    location /uploads/ {
        include proxy_params;
        proxy_pass http://unix:/home/deploy/chimney-app/chimney.sock;
    }
    location /static/ {
        include proxy_params;
        proxy_pass http://unix:/home/deploy/chimney-app/chimney.sock;
    }
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/deploy/chimney-app/chimney.sock;
    }
}
