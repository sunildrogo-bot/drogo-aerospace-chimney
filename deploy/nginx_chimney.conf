server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 8g;
    proxy_read_timeout 120s;

    # Flask selects the React login, dashboards, and protected upload handlers.
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/deploy/chimney-app/chimney.sock;
    }
}
